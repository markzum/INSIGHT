# Показатель возвращается только если фраза найдена в тексте источника.
# Новое имя добавляется сюда, без правки кода. Совпадение — это предложение, не отдельная цифра.

indicators:
  key_rate:
    label: Ключевая ставка
    regexes:
      - "ключев\\w{0,4}\\s+ставк\\w{0,4}[^.]{0,180}?\\d+(?:[.,]\\d+)?\\s*%"
  inflation:
    label: Инфляция
    regexes:
      - "инфляц\\w{0,8}[^.]{0,180}?\\d+(?:[.,]\\d+)?\\s*%"
  usd_rub:
    label: Курс доллара
    regexes:
      - "доллар\\w{0,3}[^.]{0,120}?\\d+(?:[.,]\\d+)?"
  unemployment:
    label: Безработица
    regexes:
      - "безработиц\\w{0,6}[^.]{0,120}?\\d+(?:[.,]\\d+)?\\s*%"
  gdp:
    label: ВВП
    regexes:
      - "ВВП[^.]{0,120}?\\d+(?:[.,]\\d+)?\\s*%"
  commodities:
    label: Сырьё
    regexes:
      - "(?:золот\\w{0,6}|нефт\\w{0,6}|металл\\w{0,6})[^.]{0,120}?\\d+(?:[.,]\\d+)?"
