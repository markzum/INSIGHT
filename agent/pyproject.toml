[project]
name = "insight-agent"
version = "0.1.0"
description = "Персонализированная интерпретация новостей для крупного бизнеса"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.9,<3",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "pypdf>=5.1,<6",
  "rank-bm25>=0.2.2,<1",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
